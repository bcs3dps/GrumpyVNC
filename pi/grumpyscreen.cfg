# ----------------------------------------------------------------------------
#   grumpyscreen.cfg -- GrumpyScreen served over VNC from a Raspberry Pi
#
#   For a Pi (Zero W, Zero 2 W, 3, 4, 5) that runs GrumpyScreen WITHOUT a
#   panel of its own: the UI is drawn into the built-in VNC server and shown
#   by a VNC client elsewhere -- typically on a printer's own screen.  The
#   Moonraker it talks to is on the same Pi.
#
#   Differences from the stock grumpyscreen.cfg, which is written for a
#   printer that GrumpyScreen runs on directly:
#     [vnc]       display: vnc -- draw into the VNC server, not /dev/fb0.
#     [ui]        display_rotate: 0 -- a VNC client shows the frame as sent.
#     [moonraker] host by IP address: the static build does no name lookup
#                 reliably, so a name would fail where an address cannot.
#                 thumbnail_path /dev/shm: thumbnails are always downloaded
#                 through Moonraker's file API into RAM (a Pi's /tmp is on
#                 the SD card), never read from the server's own paths.
#     [commands]  the printer-side scripts are left EMPTY, which hides their
#                 tiles; gui_restart_cmd empty makes Restart GUI restart the
#                 program in place; shutdown_host_cmd and reboot_host_cmd
#                 "moonraker" ask Moonraker (machine.shutdown /
#                 machine.reboot) to shut the Pi down or reboot it, so the
#                 Moonraker server's own rules decide whether it may.
#
#   Several printers on one Pi: one GrumpyScreen per printer, each with its
#   own copy of this file (a different [vnc] port and [moonraker] port),
#   chosen with CONFIG_FILE=<path>.
#
#   Every [vnc] key can be overridden on the command line (--display,
#   --vnc-port, --vnc-listen, --vnc-width, --vnc-height, --vnc-hextile,
#   --vnc-wifi); --help lists them.
# ----------------------------------------------------------------------------

[vnc]
# vnc = the built-in VNC server; fbdev = a local panel (/dev/fb0 + evdev)
display: vnc
# TCP port for VNC clients (5900 is VNC display :0)
port: 5900
# IPv4 address to listen on; empty = every interface
listen:
# the VNC display's size in pixels (a 532x300 printer panel)
width: 532
height: 300
# on = a VNC client that asks for Hextile gets it (smaller updates for a flat
# UI); off = Raw pixels to every client
hextile: on
# off = no WiFi panel at all (it would manage THIS Pi's WiFi); on = the WiFi
# tab as on a local panel, using the wpa_supplicant control socket named by
# WPA_SUPPLICANT_SOCKET (default /var/run/wpa_supplicant)
wifi: off

[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
invert_z_icon: false
prompt_emergency_stop: true
# seconds of no touch before the display sleeps (clients are served black);
# specify -1 for never
display_sleep_sec: 600
# log levels are info, debug, trace
log_level: info
display_rotate: 0
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336

[mmu]
backend: none

[moonraker]
# the Moonraker-compatible server on this Pi, and its port for this printer
host: 127.0.0.1
port: 7125
# the directory thumbnails are downloaded into over HTTP, through Moonraker's
# file API, whatever server that is and wherever it runs; it must exist, and
# /dev/shm is RAM, so they cost the SD card nothing.  Left empty with a local
# host, GrumpyScreen would instead read them from disk at the server's
# gcodes path, which only works when the server keeps them there
thumbnail_path: /dev/shm

[commands]
# empty = the tile is hidden (these are printer-side scripts a Pi does not have)
factory_reset_cmd:
switch_to_stock_cmd:
support_zip_cmd:
restart_klipper_cmd:
restart_wifi_cmd:
# empty = Restart GUI restarts this program in place
gui_restart_cmd:
# moonraker = ask Moonraker to shut the host down (machine.shutdown)
shutdown_host_cmd: moonraker
# moonraker = ask Moonraker to reboot the host (machine.reboot); empty = no
# Reboot Host tile
reboot_host_cmd: moonraker
