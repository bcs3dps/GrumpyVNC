# ----------------------------------------------------------------------------
#   grumpyscreen.cfg -- GrumpyScreen on a printer's own sunxi panel
#
#   For the "sunxi" build (bash crossbuild/build.sh sunxi): GrumpyScreen runs
#   ON the printer (an Allwinner R528 with a 532x300 panel on /dev/fb0 and a
#   touch screen on /dev/input/event0) in place of the printer's stock GUI,
#   and talks to a Moonraker server running on this printer or on another
#   machine on the network.  That build has no VNC support at all.
#
#   [moonraker] host below is 0.0.0.0, which GrumpyScreen reads as THIS
#   machine and connects to 127.0.0.1: leave it so when the Moonraker server
#   runs on the printer.  When it runs on another machine, set host to that
#   machine's address and port to its Moonraker port for this printer.  Use
#   an IP address: the static build does no name lookup reliably.
#
#   Running it (as root on the printer; the stock GUI must not be running --
#   it ignores SIGTERM, so it is stopped with -9):
#       killall -9 ec-eeb001-gui
#       CONFIG_FILE=<this file> LVGL_EVDEV_DEV=/dev/input/event0 ./grumpyscreen
#   The stock GUI is relaunched afterwards with the printer's own environment
#   (see the PrimeVNC restore-UI sample script); a reboot also brings it back.
#
#   Differences from the Pi's pi/grumpyscreen.cfg:
#     [vnc]       display: fbdev -- the local panel (the only display this
#                 build has).
#     [ui]        display_rotate: 0 -- the panel and its touch are both
#                 532x300, unrotated; touch needs no calibration.
#     [commands]  every tile's command EMPTY, which hides it: the printer has
#                 none of the scripts they run, and "Shutdown Host" / "Reboot
#                 Host" through Moonraker would act on whatever machine runs
#                 the Moonraker server -- another machine, or this printer
#                 itself.  gui_restart_cmd empty makes Restart GUI restart
#                 GrumpyScreen in place.
#     [moonraker] thumbnail_path: /tmp -- thumbnails are always downloaded
#                 through Moonraker's file API into /tmp (RAM on the
#                 printer, cleared at reboot), never read from the server's
#                 own paths on disk.
# ----------------------------------------------------------------------------

[vnc]
# fbdev = this panel (/dev/fb0 + evdev touch)
display: fbdev

[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
invert_z_icon: false
prompt_emergency_stop: true
# seconds of no touch before the display sleeps (the backlight is turned
# off; a touch wakes it); specify -1 for never
display_sleep_sec: 600
# log levels are info, debug, trace
log_level: info
display_rotate: 0
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336

[mmu]
backend: none

[moonraker]
# the address of the machine running the Moonraker server (an IP address);
# 0.0.0.0 means this printer itself, and GrumpyScreen connects to 127.0.0.1
host: 0.0.0.0
# the Moonraker server's port for this printer
port: 7125
# the directory thumbnails are downloaded into over HTTP, through Moonraker's
# file API, whatever server that is and wherever it runs; it must exist.
# Left empty with a local host, GrumpyScreen would instead read them from
# disk at the server's gcodes path, which only works when the server keeps
# them there
thumbnail_path: /tmp

[commands]
# empty = the tile is hidden (none of these exist on the printer)
factory_reset_cmd:
switch_to_stock_cmd:
support_zip_cmd:
restart_klipper_cmd:
restart_wifi_cmd:
# empty = Restart GUI restarts this program in place
gui_restart_cmd:
# empty = hidden: through Moonraker these would shut down or reboot the
# machine running the Moonraker server, whichever it is
shutdown_host_cmd:
reboot_host_cmd:
